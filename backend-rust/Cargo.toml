[package]
name = "vibehr-backend"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.9"
base64 = "0.22"
bigdecimal = "0.4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
fs2 = "0.4"
hex = "0.4"
percent-encoding = "2"
printpdf = { version = "0.7", default-features = false }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "derive", "bigdecimal", "chrono", "json"] }
subtle = "2.6"
ttf-parser = "0.19"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

spring:
  application:
    name: vibe-hr-spring
  jackson:
    property-naming-strategy: SNAKE_CASE
    time-zone: UTC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vibe_hr}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE:30s}

server:
  shutdown: graceful

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui/index.html
    url: /openapi.json
    oauth2-redirect-url: /docs/oauth2-redirect

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        environment: ${SPRING_PROFILES_ACTIVE:default}

vibehr:
  application:
    name: ${APP_NAME:Vibe-HR API}
    environment: ${ENVIRONMENT:local}
  auth:
    secret: ${AUTH_TOKEN_SECRET:}
    algorithm: ${AUTH_TOKEN_ALGORITHM:HS256}
    issuer: ${AUTH_TOKEN_ISSUER:vibe-hr}
    expires-minutes: ${AUTH_TOKEN_EXPIRES_MIN:480}
  bff-assertion:
    secret: ${VIBEHR_BFF_ASSERTION_SECRET:}
    max-ttl-seconds: ${VIBEHR_BFF_ASSERTION_MAX_TTL_SECONDS:60}
  cors:
    origins: ${CORS_ORIGINS:http://localhost:3000}

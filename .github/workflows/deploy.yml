name: Deploy Vibe-HR

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui:
    uses: ./.github/workflows/ui-validation.yml
    permissions:
      contents: read

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Korean PDF fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fontconfig fonts-nanum
          fc-match NanumGothic | grep -qi nanum

      - name: Verify migration inventories and BFF cutover
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/spring-migration/deploy-security.sh
          pwsh -File scripts/spring-migration/smoke-spring-compose.behavior.test.ps1
          find scripts orchestration -name '*.test.js' -print0 | xargs -0 node --test
          node scripts/spring-migration/retirement-snapshot.js
          node scripts/spring-migration/endpoint-manifest.js --verify
          node scripts/spring-migration/spring-route-coverage.test.js
          node scripts/spring-migration/spring-route-coverage.js --verify-complete
          node scripts/spring-migration/schema-ledger.test.js
          node scripts/spring-migration/schema-ledger.js --check-complete
          node scripts/spring-migration/spring-schema-coverage.test.js
          node scripts/spring-migration/spring-schema-coverage.js --verify-complete
          node scripts/spring-migration/mutation-ledger.test.js
          node scripts/spring-migration/mutation-ledger.js --check-complete
          node scripts/spring-migration/flyway-baseline.js --verify
          node scripts/spring-migration/flyway-seed-ledger.js --verify
          node scripts/spring-migration/bff-cutover-audit.js
          node scripts/spring-migration/verify-delivery.js

      - name: Verify Spring build and unit tests
        id: spring_unit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd backend-spring
          log_file="${RUNNER_TEMP}/spring-unit-gradle.log"
          set +e
          ./gradlew --no-daemon --console=plain clean compileJava test bootJar 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Publish Spring unit failure diagnostics
        if: always() && steps.spring_unit.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sanitize = (value) => value
            .replace(/((?:password|secret|token|authorization|api[_-]?key)\s*(?:=|:|\s)\s*)\S+/gi, '$1[REDACTED]')
            .replace(/postgres(?:ql)?:\/\/[^\s@]+@/gi, 'postgres://[REDACTED]@')
            .replace(/[A-Fa-f0-9]{64}/g, '[REDACTED_HEX]');
          const annotateTail = (title, file) => {
            if (!fs.existsSync(file)) return;
            const tail = sanitize(fs.readFileSync(file, 'utf8').split(/\r?\n/).slice(-100).join('\n'));
            for (let index = 0; index < tail.length; index += 850) {
              console.log(`::error title=${title} (${index / 850 + 1})::${tail.slice(index, index + 850).replace(/\r?\n/g, ' | ')}`);
            }
          };
          const root = 'backend-spring/build/test-results/test';
          const files = fs.existsSync(root)
            ? fs.readdirSync(root, { recursive: true }).filter((file) => file.endsWith('.xml'))
            : [];
          const failures = [];
          for (const file of files) {
            const xml = fs.readFileSync(path.join(root, file), 'utf8');
            for (const match of xml.matchAll(/<testcase[^>]*classname="([^"]+)"[^>]*name="([^"]+)"[\s\S]*?<(failure|error)[^>]*>([\s\S]*?)<\/(?:failure|error)>/g)) {
              failures.push(`${match[1]}#${match[2]}: ${match[4].replace(/\s+/g, ' ').trim().slice(0, 900)}`);
            }
          }
          if (failures.length === 0) {
            console.log('::error title=Spring unit tests::Gradle failed before producing a JUnit failure report; sanitized Gradle tail follows.');
          } else {
            for (const failure of failures.slice(0, 10)) console.log(`::error title=Spring unit tests::${failure}`);
          }
          annotateTail('Spring unit Gradle tail', process.env.RUNNER_TEMP + '/spring-unit-gradle.log');
          NODE
          exit 1

      - name: Verify Spring Testcontainers integration
        id: spring_integration
        if: steps.spring_unit.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          VIBEHR_RUN_CONTAINER_TESTS: "true"
        run: |
          set -euo pipefail
          cd backend-spring
          log_file="${RUNNER_TEMP}/spring-integration-gradle.log"
          set +e
          {
            echo '--- Docker compatibility diagnostics (sanitized) ---'
            docker version --format 'client={{.Client.Version}} server={{.Server.Version}} api={{.Server.APIVersion}} os={{.Server.Os}} arch={{.Server.Arch}}'
            docker info --format 'driver={{.Driver}} cgroup={{.CgroupVersion}} cpus={{.NCPU}} mem={{.MemTotal}} rootless={{.SecurityOptions}}'
            docker events --since 2m --until 0s --format '{{.Status}} {{.Type}} {{.Actor.Attributes.name}}' 2>/dev/null | tail -40 || true
            echo '--- Gradle integrationTest ---'
            ./gradlew --no-daemon --console=plain integrationTest
            echo '--- Gradle migrationIntegrationTest ---'
            ./gradlew --no-daemon --console=plain migrationIntegrationTest
          } 2>&1 | tee "$log_file"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Publish Spring integration failure diagnostics
        if: always() && steps.spring_integration.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sanitize = (value) => value
            .replace(/((?:password|secret|token|authorization|api[_-]?key)\s*(?:=|:|\s)\s*)\S+/gi, '$1[REDACTED]')
            .replace(/postgres(?:ql)?:\/\/[^\s@]+@/gi, 'postgres://[REDACTED]@')
            .replace(/[A-Fa-f0-9]{64}/g, '[REDACTED_HEX]');
          const annotateTail = (title, file) => {
            if (!fs.existsSync(file)) return;
            const tail = sanitize(fs.readFileSync(file, 'utf8').split(/\r?\n/).slice(-140).join('\n'));
            for (let index = 0; index < tail.length; index += 850) {
              console.log(`::error title=${title} (${index / 850 + 1})::${tail.slice(index, index + 850).replace(/\r?\n/g, ' | ')}`);
            }
          };
          const root = 'backend-spring/build/test-results';
          const files = fs.existsSync(root)
            ? fs.readdirSync(root, { recursive: true }).filter((file) => file.endsWith('.xml'))
            : [];
          const failures = [];
          for (const file of files) {
            const xml = fs.readFileSync(path.join(root, file), 'utf8');
            for (const match of xml.matchAll(/<testcase[^>]*classname="([^"]+)"[^>]*name="([^"]+)"[\s\S]*?<(failure|error)[^>]*>([\s\S]*?)<\/(?:failure|error)>/g)) {
              const detail = match[4].replace(/\s+/g, ' ').trim().slice(0, 900);
              failures.push(`${match[1]}#${match[2]}: ${detail}`);
            }
          }
          if (failures.length === 0) {
            console.log('::error title=Spring Testcontainers integration::Gradle failed before producing a JUnit failure report; sanitized Gradle and Docker diagnostic tails follow.');
          } else {
            for (const failure of failures.slice(0, 10)) {
              console.log(`::error title=Spring Testcontainers integration::${failure}`);
            }
          }
          annotateTail('Spring Testcontainers Gradle/Docker tail', process.env.RUNNER_TEMP + '/spring-integration-gradle.log');
          NODE
          exit 1

      - name: Frontend tests
        shell: bash
        env:
          VIBEHR_BFF_BACKEND_URL: http://backend:8080
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run validate:grid
          npm run lint
          npm run build
          npm run test

      - name: Verify Spring-only delivery image and compose smoke
        shell: bash
        run: |
          set -euo pipefail
          pwsh -File scripts/spring-migration/smoke-spring-compose.ps1

  deploy:
    needs: [test, ui]
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER != '' && secrets.DEPLOY_USER || vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT != '' && secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout tested release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate deploy configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${DEPLOY_HOST}" ]] && missing+=("DEPLOY_HOST (Secret or Variable)")
          [[ -z "${DEPLOY_USER}" ]] && missing+=("DEPLOY_USER (Secret or Variable)")
          [[ -z "${DEPLOY_SSH_KEY}" ]] && missing+=("DEPLOY_SSH_KEY (Secret)")
          [[ -z "${DEPLOY_KNOWN_HOSTS}" ]] && missing+=("DEPLOY_KNOWN_HOSTS (Secret)")
          if [[ ! "${DEPLOY_PORT}" =~ ^[0-9]+$ ]] || (( 10#${DEPLOY_PORT} < 1 || 10#${DEPLOY_PORT} > 65535 )); then
            missing+=("DEPLOY_PORT (must be an integer from 1 to 65535)")
          fi
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Missing required deploy settings: ${missing[*]}"
            exit 1
          fi

      - name: Build release images on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          revision="${GITHUB_SHA}"
          backend_image="vibehr-backend-spring:release-${revision}"
          frontend_image="vibehr-frontend:release-${revision}"
          docker build --label "org.opencontainers.image.revision=${revision}" --tag "${backend_image}" backend-spring
          docker build --file frontend/Dockerfile --label "org.opencontainers.image.revision=${revision}" --tag "${frontend_image}" .
          archive="${RUNNER_TEMP}/vibehr-release-${revision}.tar.gz"
          docker save "${backend_image}" "${frontend_image}" | gzip --stdout > "${archive}"
          test -s "${archive}"
          echo "RELEASE_ARCHIVE=${archive}" >> "${GITHUB_ENV}"

      - name: Secure SSH preflight and staged Spring deployment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          keyfile=$(mktemp)
          known_hosts=$(mktemp)
          trap 'rm -f "$keyfile" "$known_hosts"' EXIT
          printf '%s\n' "${DEPLOY_SSH_KEY}" > "$keyfile"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > "$known_hosts"
          chmod 600 "$keyfile" "$known_hosts"

          known_host="${DEPLOY_HOST}"
          if [[ "${DEPLOY_PORT}" != "22" ]]; then
            known_host="[${DEPLOY_HOST}]:${DEPLOY_PORT}"
          fi
          ssh-keygen -F "$known_host" -f "$known_hosts" >/dev/null || {
            echo "::error::DEPLOY_KNOWN_HOSTS does not contain an exact host key entry for ${known_host}."
            exit 1
          }

          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts}"
            -o GlobalKnownHostsFile=/dev/null
            -i "$keyfile"
            -p "${DEPLOY_PORT}"
          )
          scp_options=(
            -o BatchMode=yes
            -o ConnectTimeout=10
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${known_hosts}"
            -o GlobalKnownHostsFile=/dev/null
            -i "$keyfile"
            -P "${DEPLOY_PORT}"
          )
          timeout 10 bash -c ': >"/dev/tcp/$1/$2"' bash "${DEPLOY_HOST}" "${DEPLOY_PORT}" || {
            echo "::error::Cannot reach ${DEPLOY_HOST}:${DEPLOY_PORT} from the GitHub runner."
            exit 1
          }
          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "echo '[preflight] ssh ok on' \"\$(hostname)\""

          release_archive="/tmp/vibehr-release-${GITHUB_SHA}.tar.gz"
          scp "${scp_options[@]}" "${RELEASE_ARCHIVE}" "${DEPLOY_USER}@${DEPLOY_HOST}:${release_archive}"

          ssh "${ssh_options[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s -- ${GITHUB_SHA} ${release_archive}" <<'REMOTE'
          set -Eeuo pipefail
          repository=/root/.openclaw/workspace/vibe-hr
          cd "$repository"
          expected_sha="$1"
          release_archive="$2"
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$release_archive" == "/tmp/vibehr-release-${expected_sha}.tar.gz" ]] || exit 1
          [[ -s "$release_archive" ]] || { echo "[deploy] release image archive is missing" >&2; exit 1; }
          cleanup_release_archive() { rm -f "$release_archive"; }
          trap cleanup_release_archive EXIT
          [[ -z "$(git status --porcelain)" ]] || { echo "[deploy] dirty checkout; refusing update" >&2; exit 1; }
          git fetch origin
          git checkout main
          git pull --ff-only origin main
          [[ "$(git rev-parse HEAD)" == "$expected_sha" ]] || { echo "[deploy] main advanced beyond tested SHA; rerun workflow" >&2; exit 1; }
          python3 scripts/ci/require-ui-validation.py --sha "$expected_sha" --wait-seconds 1200

          restore_operator_config() {
            if [[ -n "${backup_dir:-}" && -f "${backup_dir}/docker-compose.deploy.yml" ]]; then
              cp "$backup_dir/docker-compose.deploy.yml" docker-compose.deploy.yml
              cp "$backup_dir/.env.deploy" .env.deploy
              cp "$backup_dir/.env.deploy.secret" .env.deploy.secret
            fi
          }
          wait_for_candidate() {
            local url="$1"
            for _ in $(seq 1 30); do
              curl --fail --silent --show-error "$url" >/dev/null && return 0
              sleep 2
            done
            return 1
          }
          rollback_release() {
            echo "[deploy] restoring the previous Spring images and configuration" >&2
            restore_operator_config
            cat > "$backup_dir/rollback.override.yml" <<EOF
          services:
            backend:
              image: ${rollback_backend}
            frontend:
              image: ${rollback_frontend}
          EOF
            if ! docker compose -f docker-compose.deploy.yml -f "$backup_dir/rollback.override.yml" up -d --no-build --remove-orphans --force-recreate; then
              echo "[deploy] rollback compose failed" >&2
              return 1
            fi
            if ! wait_for_candidate http://127.0.0.1:8080/actuator/health/readiness; then
              echo "[deploy] rollback readiness check failed" >&2
              return 1
            fi
            if ! wait_for_candidate http://127.0.0.1:8080/openapi.json; then
              echo "[deploy] rollback OpenAPI check failed" >&2
              return 1
            fi
            if ! wait_for_candidate http://127.0.0.1:3000/login; then
              echo "[deploy] rollback frontend check failed" >&2
              return 1
            fi
          }
          fail() {
            echo "[deploy] $*" >&2
            if [[ "${rollback_ready:-false}" == "true" ]]; then
              if ! rollback_release; then
                echo "::error::Spring rollback recovery failed" >&2
              fi
            else
              restore_operator_config
            fi
            exit 1
          }
          require_env() { local variable="$1"; [[ -n "${!variable:-}" ]] || fail "missing required environment variable: ${variable}"; }
          require_canonical_app_origin() {
            local value="${APP_ORIGIN:-}"
            [[ "$value" =~ ^https?://[A-Za-z0-9.-]+(:[0-9]{1,5})?$ ]] || fail "APP_ORIGIN must be a canonical HTTP(S) origin"
          }

          [[ -f .env.deploy.secret ]] || fail ".env.deploy.secret is required; refusing to create an empty secret file"
          backup_dir=$(mktemp -d /tmp/vibehr-deploy.XXXXXX)
          timestamp=$(date +%Y%m%d-%H%M%S)
          candidate_name="vibehr-backend-candidate-${timestamp}"
          candidate_port=$((19000 + RANDOM % 1000))
          candidate_url="http://127.0.0.1:${candidate_port}"
          cleanup_candidate() { docker rm --force "$candidate_name" >/dev/null 2>&1 || true; }
          on_exit() {
            status=$?
            cleanup_candidate
            cleanup_release_archive
            if [[ "$status" -ne 0 ]]; then
              restore_operator_config
            fi
            trap - EXIT
            exit "$status"
          }
          trap on_exit EXIT

          cp docker-compose.deploy.yml "$backup_dir/docker-compose.deploy.yml"
          cp .env.deploy "$backup_dir/.env.deploy"
          cp .env.deploy.secret "$backup_dir/.env.deploy.secret"
          previous_frontend=$(docker inspect --format '{{.Image}}' vibehr-frontend 2>/dev/null) || fail "no running frontend release is available for automatic rollback"
          previous_backend=$(docker inspect --format '{{.Image}}' vibehr-backend-spring 2>/dev/null) || fail "no running Spring backend release is available; a non-Spring release is not a rollback target"
          rollback_backend="vibehr-backend-spring:rollback-${timestamp}"
          rollback_frontend="vibehr-frontend:rollback-${timestamp}"
          docker image tag "$previous_backend" "$rollback_backend" || fail "unable to retain the previous Spring backend image"
          docker image tag "$previous_frontend" "$rollback_frontend" || fail "unable to retain the previous frontend image"
          rollback_ready=true

          [[ "$(git rev-parse HEAD)" == "$expected_sha" ]] || fail "checkout changed after UI gate"

          source scripts/spring-migration/load-deploy-env.sh || fail "deployment dotenv parser is unavailable"
          load_deploy_env .env.deploy || fail "tracked deployment environment is invalid"
          load_deploy_env .env.deploy.secret || fail "deployment secret environment is invalid"
          require_env SPRING_DATASOURCE_URL
          require_env SPRING_DATASOURCE_USERNAME
          require_env SPRING_DATASOURCE_PASSWORD
          require_env AUTH_TOKEN_SECRET
          require_env VIBEHR_BFF_ASSERTION_SECRET
          require_env VIBEHR_BFF_BACKEND_URL
          [[ "$SPRING_DATASOURCE_URL" == jdbc:postgresql://* ]] || fail "SPRING_DATASOURCE_URL must be a PostgreSQL JDBC URL"
          is_valid_deploy_secret "$AUTH_TOKEN_SECRET" || fail "AUTH_TOKEN_SECRET must be exactly 64 hexadecimal characters from openssl rand -hex 32"
          is_valid_deploy_secret "$VIBEHR_BFF_ASSERTION_SECRET" || fail "VIBEHR_BFF_ASSERTION_SECRET must be exactly 64 hexadecimal characters from openssl rand -hex 32"
          are_distinct_deploy_secrets "$AUTH_TOKEN_SECRET" "$VIBEHR_BFF_ASSERTION_SECRET" || fail "AUTH_TOKEN_SECRET and VIBEHR_BFF_ASSERTION_SECRET must be distinct generated values"
          require_env VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER
          [[ "$VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER" == "x-vibehr-client-ip" ]] || fail "VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER must be x-vibehr-client-ip and set only by the sanitizing reverse proxy"
          require_canonical_app_origin
          [[ "$VIBEHR_BFF_BACKEND_URL" == "http://backend:8080" ]] || fail "VIBEHR_BFF_BACKEND_URL must remain the Docker-internal Spring URL"
          [[ "${VIBEHR_ALLOW_FIXTURE_SEEDING:-false}" != "true" ]] || fail "fixture seeding is forbidden on a deployment target"
          docker compose -f docker-compose.deploy.yml config -q || fail "deployment compose configuration is invalid"

          backend_release="vibehr-backend-spring:release-${expected_sha}"
          frontend_release="vibehr-frontend:release-${expected_sha}"
          docker load --input "$release_archive" || fail "unable to load hosted release images"
          [[ "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$backend_release")" == "$expected_sha" ]] || fail "backend image revision does not match tested SHA"
          [[ "$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "$frontend_release")" == "$expected_sha" ]] || fail "frontend image revision does not match tested SHA"
          docker run --detach --rm --name "$candidate_name" \
            --env-file .env.deploy --env-file .env.deploy.secret \
            -e SPRING_PROFILES_ACTIVE=flyway-cutover \
            -e VIBEHR_SCHEMA_OWNER=flyway \
            --add-host host.docker.internal:host-gateway \
            -p "127.0.0.1:${candidate_port}:8080" \
            "$backend_release" >/dev/null || fail "candidate container could not start"
          wait_for_candidate "$candidate_url/actuator/health/readiness" || fail "candidate readiness check failed"
          wait_for_candidate "$candidate_url/openapi.json" || fail "candidate OpenAPI check failed"
          cleanup_candidate

          cat > "$backup_dir/release.override.yml" <<EOF
          services:
            backend:
              image: ${backend_release}
            frontend:
              image: ${frontend_release}
          EOF
          docker compose -f docker-compose.deploy.yml -f "$backup_dir/release.override.yml" up -d --no-build --remove-orphans --force-recreate || fail "promotion compose failed"
          wait_for_candidate http://127.0.0.1:8080/actuator/health/readiness || fail "promotion readiness check failed"
          wait_for_candidate http://127.0.0.1:8080/openapi.json || fail "promotion OpenAPI check failed"
          wait_for_candidate http://127.0.0.1:3000/login || fail "promotion frontend check failed"
          docker compose -f docker-compose.deploy.yml ps || fail "unable to inspect the promoted release"
          rm -rf "$backup_dir"
          REMOTE

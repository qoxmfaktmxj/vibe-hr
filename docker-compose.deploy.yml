x-rust: &rust
  image: ${VIBEHR_BACKEND_IMAGE:-vibehr-backend-rust:deploy}
  build:
    context: ./backend-rust
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-database: &database
  SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
  SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
  SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
  VIBEHR_SCHEMA_OWNER: ${VIBEHR_SCHEMA_OWNER:?VIBEHR_SCHEMA_OWNER is required}

services:
  preflight:
    <<: *rust
    command: ["schema-preflight"]
    environment: *database
    healthcheck:
      disable: true
  migrate:
    image: redgate/flyway:12.4.0
    command: ["migrate"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FLYWAY_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      FLYWAY_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      FLYWAY_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      FLYWAY_LOCATIONS: filesystem:/migrations
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
    volumes:
      - ./backend-spring/src/main/resources/db/migration:/migrations:ro
    depends_on:
      preflight:
        condition: service_completed_successfully
  verify-schema:
    <<: *rust
    command: ["schema-verify", "/migrations/schema-metadata-manifest.json"]
    environment: *database
    healthcheck:
      disable: true
    volumes:
      - ./backend-spring/src/main/resources/db/migration:/migrations:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
  backend:
    <<: *rust
    container_name: vibehr-backend-rust
    restart: unless-stopped
    env_file:
      - ./.env.deploy
      - ./.env.deploy.secret
    environment:
      VIBEHR_SCHEMA_OWNER: ${VIBEHR_SCHEMA_OWNER:?VIBEHR_SCHEMA_OWNER is required}
    depends_on:
      verify-schema:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vibehr-frontend
    restart: unless-stopped
    env_file:
      - ./.env.deploy
      - ./.env.deploy.secret
    environment:
      VIBEHR_BFF_BACKEND_URL: ${VIBEHR_BFF_BACKEND_URL:?VIBEHR_BFF_BACKEND_URL is required}
      VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER: ${VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER:?VIBEHR_BFF_TRUSTED_CLIENT_IP_HEADER is required}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
